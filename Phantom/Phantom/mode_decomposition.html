<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>06 Phantom Mode Decomposition</title>
<style>
:root {
  --color-background-primary: #ffffff;
  --color-background-secondary: #f5f5f0;
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #666660;
  --color-text-tertiary: #8a8a82;
  --color-border-tertiary: rgba(0,0,0,0.15);
  --border-radius-lg: 12px;
  --border-radius-md: 8px;
  --font-sans: system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --color-background-primary: #1a1a1e;
    --color-background-secondary: #2a2a2e;
    --color-text-primary: #e8e8e0;
    --color-text-secondary: #999990;
    --color-text-tertiary: #777770;
    --color-border-tertiary: rgba(255,255,255,0.15);
  }
}
body {
  font-family: var(--font-sans);
  background: var(--color-background-primary);
  color: var(--color-text-primary);
  max-width: 700px;
  margin: 0 auto;
  padding: 1rem;
}
input[type=range] {
  -webkit-appearance: none;
  height: 4px;
  background: var(--color-border-tertiary);
  border-radius: 2px;
  outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--color-text-primary);
  cursor: pointer;
}
.sr-only {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0,0,0,0); border: 0;
}
</style>
</head>
<body>

<h2 class="sr-only">Rounded rectangle drum phantom mode analysis: eigenmode decomposition showing ghost modes created by blind patch</h2>
<div style="padding: 0.5rem 0;">
  <canvas id="cv" style="width: 100%; border-radius: var(--border-radius-lg); cursor: crosshair;"></canvas>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; margin-top: 6px;">
    <div style="display:flex;align-items:center;gap:8px;"><label style="font-size:12px;color:var(--color-text-secondary);min-width:65px;">Mode m</label><input type="range" id="mM" min="1" max="8" value="3" step="1" style="flex:1;"><span id="mMV" style="font-size:12px;font-weight:500;min-width:16px;">3</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><label style="font-size:12px;color:var(--color-text-secondary);min-width:65px;">Mode n</label><input type="range" id="nN" min="1" max="6" value="2" step="1" style="flex:1;"><span id="nNV" style="font-size:12px;font-weight:500;min-width:16px;">2</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><label style="font-size:12px;color:var(--color-text-secondary);min-width:65px;">Patch size</label><input type="range" id="pSize" min="5" max="40" value="16" step="1" style="flex:1;"><span id="pSizeV" style="font-size:12px;font-weight:500;min-width:16px;">16</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><label style="font-size:12px;color:var(--color-text-secondary);min-width:65px;">Patch X</label><input type="range" id="pX" min="10" max="90" value="72" step="1" style="flex:1;"><span id="pXV" style="font-size:12px;font-weight:500;min-width:20px;">72</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><label style="font-size:12px;color:var(--color-text-secondary);min-width:65px;">Patch Y</label><input type="range" id="pY" min="10" max="90" value="28" step="1" style="flex:1;"><span id="pYV" style="font-size:12px;font-weight:500;min-width:20px;">28</span></div>
    <div style="display:flex;align-items:center;gap:8px;"><label style="font-size:12px;color:var(--color-text-secondary);min-width:65px;">2nd mode</label><input type="range" id="mix" min="0" max="50" value="0" step="1" style="flex:1;"><span id="mixV" style="font-size:12px;font-weight:500;min-width:20px;">0</span></div>
  </div>
  <div style="font-size: 11px; color: var(--color-text-tertiary); margin-top: 4px;">Drag the patch on panel 1. Mode grid shows (m,n) decomposition \u2014 stars are phantoms.</div>
</div>
<script>
const Nx=160,Ny=100,NN=Nx*Ny;
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const dpr=window.devicePixelRatio||1;
const CW=680;
const halfW=(CW-16-8)/2;
const panH=Math.round(halfW*Ny/Nx);
const gridH=halfW;
const LM=8,vgap=6,labH=15;
const r1y=labH+2;
const r2y=r1y+panH+vgap+labH;
const r3y=r2y+gridH+vgap+labH;
const CH=r3y+panH+6;
cv.width=CW*dpr;cv.height=CH*dpr;cv.style.height=CH+'px';ctx.scale(dpr,dpr);
const RR=8;
const isDark=(()=>{const bg=getComputedStyle(document.documentElement).getPropertyValue('--color-background-primary').trim();return bg.startsWith('#')&&parseInt(bg.slice(1,3),16)<80;})();
const txtCol=isDark?'rgba(220,218,210,0.85)':'rgba(40,40,38,0.8)';
const rimCol=isDark?'rgba(180,178,169,0.35)':'rgba(40,40,38,0.3)';
const dimCol=isDark?'rgba(180,178,169,0.5)':'rgba(60,60,58,0.5)';

['mM','nN','pSize','pX','pY','mix'].forEach(id=>{document.getElementById(id).oninput=function(){document.getElementById(id+'V').textContent=this.value;};});

let drag=false;
function cxy(e){const r=cv.getBoundingClientRect();return[((e.clientX||e.touches[0].clientX)-r.left)/r.width*CW,((e.clientY||e.touches[0].clientY)-r.top)/r.height*CH];}
cv.addEventListener('mousedown',e=>{const[x,y]=cxy(e);if(x>=LM&&x<=LM+halfW&&y>=r1y&&y<=r1y+panH){drag=true;}});
cv.addEventListener('mousemove',e=>{if(!drag)return;const[x,y]=cxy(e);
  document.getElementById('pX').value=Math.round(Math.max(10,Math.min(90,(x-LM)/halfW*100)));
  document.getElementById('pY').value=Math.round(Math.max(10,Math.min(90,(y-r1y)/panH*100)));
  document.getElementById('pXV').textContent=document.getElementById('pX').value;
  document.getElementById('pYV').textContent=document.getElementById('pY').value;
});
cv.addEventListener('mouseup',()=>{drag=false;});
cv.addEventListener('touchstart',e=>{const[x,y]=cxy(e);if(x>=LM&&x<=LM+halfW&&y>=r1y&&y<=r1y+panH){drag=true;e.preventDefault();}},{passive:false});
cv.addEventListener('touchmove',e=>{if(!drag)return;e.preventDefault();const[x,y]=cxy(e);
  document.getElementById('pX').value=Math.round(Math.max(10,Math.min(90,(x-LM)/halfW*100)));
  document.getElementById('pY').value=Math.round(Math.max(10,Math.min(90,(y-r1y)/panH*100)));
  document.getElementById('pXV').textContent=document.getElementById('pX').value;
  document.getElementById('pYV').textContent=document.getElementById('pY').value;
},{passive:false});
cv.addEventListener('touchend',()=>{drag=false;});

const plate=new Float64Array(NN),masked=new Float64Array(NN),mask=new Float64Array(NN);
const ghostF=new Float64Array(NN),domF=new Float64Array(NN);

const mMax=10,nMax=8;

function cymCol(t){t=Math.max(0,Math.min(1,t));const r=Math.abs(t*2-1);if(t<.5)return[Math.round(10+r*55),Math.round(8+r*25),Math.round(70+r*160)];return[Math.round(65+r*190),Math.round(33+r*120),Math.round(230-r*40)];}
function ghostCm(t){t=Math.max(0,Math.min(1,t));if(t<.4){const s=t/.4;return[Math.round(10+s*20),Math.round(15+s*50),Math.round(80+s*120)];}if(t<.6){const s=(t-.4)/.2;return[Math.round(30+s*10),Math.round(65+s*10),Math.round(200-s*170)];}const s=(t-.6)/.4;return[Math.round(40+s*215),Math.round(75-s*40),Math.round(30+s*20)];}

function rrC(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}

function drawRect(px,py,w,h,data,cmap,lab,showP,rlab){
  ctx.save();rrC(px,py,w,h,RR);ctx.clip();
  ctx.fillStyle='rgb(10,8,18)';ctx.fillRect(px,py,w,h);
  let mn=1e30,mx=-1e30;
  for(let i=0;i<NN;i++){if(data[i]<mn)mn=data[i];if(data[i]>mx)mx=data[i];}
  const rg=mx-mn||1,cw=w/Nx,ch=h/Ny;
  for(let iy=0;iy<Ny;iy++)for(let ix=0;ix<Nx;ix++){
    const n=(data[iy*Nx+ix]-mn)/rg;const c=cmap(Math.max(0,Math.min(1,n)));
    ctx.fillStyle=`rgb(${c[0]},${c[1]},${c[2]})`;
    ctx.fillRect(px+ix*cw,py+iy*ch,Math.ceil(cw),Math.ceil(ch));
  }
  if(showP){
    const ps=+document.getElementById('pSize').value/100;
    const pcx=+document.getElementById('pX').value/100;
    const pcy=+document.getElementById('pY').value/100;
    const pr=ps*Math.min(w,h);
    ctx.strokeStyle='rgba(255,70,70,0.9)';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    rrC(px+pcx*w-pr,py+pcy*h-pr*.7,pr*2,pr*1.4,4);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.restore();
  rrC(px,py,w,h,RR);ctx.strokeStyle=rimCol;ctx.lineWidth=1.5;ctx.stroke();
  ctx.font='500 12px sans-serif';ctx.fillStyle=txtCol;ctx.textAlign='left';ctx.fillText(lab,px+4,py-4);
  if(rlab){ctx.textAlign='right';ctx.font='400 11px sans-serif';ctx.fillStyle=dimCol;ctx.fillText(rlab,px+w-4,py-4);}
}

function samplePlate(){
  const m0=+document.getElementById('mM').value,n0=+document.getElementById('nN').value;
  const mix=document.getElementById('mix').value/100;
  for(let iy=0;iy<Ny;iy++)for(let ix=0;ix<Nx;ix++){
    const x=ix/(Nx-1),y=iy/(Ny-1);
    let v=Math.sin(m0*Math.PI*x)*Math.sin(n0*Math.PI*y);
    if(mix>0)v+=(mix)*Math.sin((m0+1)*Math.PI*x)*Math.sin((n0+1)*Math.PI*y);
    plate[iy*Nx+ix]=v;
  }
}

function buildMask(){
  const ps=+document.getElementById('pSize').value/100;
  const pcx=+document.getElementById('pX').value/100;
  const pcy=+document.getElementById('pY').value/100;
  const hw=ps,hh=ps*.7;
  for(let iy=0;iy<Ny;iy++)for(let ix=0;ix<Nx;ix++){
    const x=ix/Nx,y=iy/Ny;
    const dx=Math.abs(x-pcx)-hw+.02,dy=Math.abs(y-pcy)-hh+.02;
    const d=Math.sqrt(Math.max(dx,0)**2+Math.max(dy,0)**2)-.02+Math.min(Math.max(dx,dy),0);
    mask[iy*Nx+ix]=d>=0?1:0;
  }
}

function modeProject(data,m,n){
  let s=0,norm=0;
  for(let iy=0;iy<Ny;iy++)for(let ix=0;ix<Nx;ix++){
    const basis=Math.sin(m*Math.PI*ix/(Nx-1))*Math.sin(n*Math.PI*iy/(Ny-1));
    s+=data[iy*Nx+ix]*basis;norm+=basis*basis;
  }
  return norm>0?s/norm:0;
}

function draw(){
  ctx.clearRect(0,0,CW,CH);
  samplePlate();buildMask();
  for(let i=0;i<NN;i++)masked[i]=mask[i]?plate[i]:0;

  const m0=+document.getElementById('mM').value,n0=+document.getElementById('nN').value;
  const x1=LM,x2=LM+halfW+8;

  // Mode decomposition
  const trCoeff=[], mkCoeff=[];
  for(let m=1;m<=mMax;m++){
    trCoeff[m]=[];mkCoeff[m]=[];
    for(let n=1;n<=nMax;n++){
      trCoeff[m][n]=modeProject(plate,m,n);
      mkCoeff[m][n]=modeProject(masked,m,n);
    }
  }

  // Build ghost field (n\u2260true mode only)
  let ghostE=0,totalE=0,domGhostE=0,domM=1,domN=1;
  for(let m=1;m<=mMax;m++)for(let n=1;n<=nMax;n++){
    const e=mkCoeff[m][n]**2;totalE+=e;
    if(!(m===m0&&n===n0)){ghostE+=e;if(e>domGhostE){domGhostE=e;domM=m;domN=n;}}
  }
  const ghostPct=totalE>0?Math.round(ghostE/totalE*100):0;

  for(let iy=0;iy<Ny;iy++)for(let ix=0;ix<Nx;ix++){
    const x=ix/(Nx-1),y=iy/(Ny-1);
    let z=0;
    for(let m=1;m<=mMax;m++)for(let n=1;n<=nMax;n++){
      if(m===m0&&n===n0)continue;
      const dc=mkCoeff[m][n]-trCoeff[m][n];
      z+=dc*Math.sin(m*Math.PI*x)*Math.sin(n*Math.PI*y);
    }
    ghostF[iy*Nx+ix]=z;
  }

  // Dominant ghost
  const dc=mkCoeff[domM][domN]-trCoeff[domM][domN];
  for(let iy=0;iy<Ny;iy++)for(let ix=0;ix<Nx;ix++){
    domF[iy*Nx+ix]=dc*Math.sin(domM*Math.PI*ix/(Nx-1))*Math.sin(domN*Math.PI*iy/(Ny-1));
  }

  // Row 1: true | masked
  drawRect(x1,r1y,halfW,panH,plate,cymCol,'True mode \u03C8('+m0+','+n0+')',false,'sin('+m0+'\u03C0x)\u00b7sin('+n0+'\u03C0y)');
  drawRect(x2,r1y,halfW,panH,masked,cymCol,'Measured (with blind patch)',true,'drag patch');

  // Row 2: (m,n) mode energy grid \u2014 left=true, right=masked
  const gridW=halfW,gridHt=gridH;
  ctx.save();rrC(x1,r2y,gridW,gridHt,RR);ctx.clip();
  ctx.fillStyle=isDark?'rgb(20,18,28)':'rgb(15,12,22)';ctx.fillRect(x1,r2y,gridW,gridHt);

  const gpad=32,cellW=(gridW-gpad*2)/mMax,cellH=(gridHt-gpad*2-12)/nMax;
  let eMax=0;
  for(let m=1;m<=mMax;m++)for(let n=1;n<=nMax;n++){eMax=Math.max(eMax,Math.abs(trCoeff[m][n]),Math.abs(mkCoeff[m][n]));}
  if(eMax<1e-6)eMax=1;

  // true mode grid
  for(let m=1;m<=mMax;m++)for(let n=1;n<=nMax;n++){
    const cx2=x1+gpad+(m-1)*cellW+cellW/2;
    const cy2=r2y+gpad+(n-1)*cellH+cellH/2;
    const sz=Math.abs(trCoeff[m][n])/eMax;
    if(sz<.01)continue;
    const r=sz*Math.min(cellW,cellH)*.4;
    ctx.fillStyle=m===m0&&n===n0?'rgba(60,120,255,0.7)':'rgba(60,120,255,0.3)';
    ctx.beginPath();ctx.arc(cx2-cellW*.12,cy2,r,0,Math.PI*2);ctx.fill();
  }
  // masked mode grid
  for(let m=1;m<=mMax;m++)for(let n=1;n<=nMax;n++){
    const cx2=x1+gpad+(m-1)*cellW+cellW/2;
    const cy2=r2y+gpad+(n-1)*cellH+cellH/2;
    const sz=Math.abs(mkCoeff[m][n])/eMax;
    if(sz<.01)continue;
    const r=sz*Math.min(cellW,cellH)*.4;
    const isTrue=m===m0&&n===n0;
    const isGhost=!isTrue&&sz>.03;
    ctx.fillStyle=isTrue?'rgba(255,180,60,0.7)':isGhost?'rgba(255,60,60,0.7)':'rgba(255,60,60,0.3)';
    ctx.beginPath();ctx.arc(cx2+cellW*.12,cy2,r,0,Math.PI*2);ctx.fill();
    if(isGhost&&sz>.05){
      ctx.fillStyle='rgba(255,60,60,0.9)';ctx.font='500 9px sans-serif';ctx.textAlign='center';
      ctx.fillText('\u2605',cx2+cellW*.12,cy2-r-3);
    }
  }
  // axis labels
  ctx.font='400 11px sans-serif';ctx.fillStyle=dimCol;ctx.textAlign='center';
  for(let m=1;m<=mMax;m++)ctx.fillText(m,x1+gpad+(m-1)*cellW+cellW/2,r2y+gpad+nMax*cellH+12);
  ctx.fillText('m \u2192',x1+gridW/2,r2y+gpad+nMax*cellH+24);
  for(let n=1;n<=nMax;n++){ctx.textAlign='right';ctx.fillText(n,x1+gpad-4,r2y+gpad+(n-1)*cellH+cellH/2+4);}
  ctx.save();ctx.translate(x1+gpad-18,r2y+gpad+nMax*cellH/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillText('n \u2192',0,0);ctx.restore();
  // legend
  ctx.font='400 11px sans-serif';ctx.textAlign='left';
  ctx.fillStyle='rgba(60,120,255,0.8)';ctx.fillText('true',x1+gpad,r2y+14);
  ctx.fillStyle='rgba(255,180,60,0.8)';ctx.fillText('masked',x1+gpad+30,r2y+14);
  ctx.fillStyle='rgba(255,60,60,0.9)';ctx.fillText('\u2605 phantom ('+ghostPct+'%)',x1+gpad+80,r2y+14);

  ctx.restore();
  rrC(x1,r2y,gridW,gridHt,RR);ctx.strokeStyle=rimCol;ctx.lineWidth=1;ctx.stroke();
  ctx.font='500 12px sans-serif';ctx.fillStyle=txtCol;ctx.textAlign='left';ctx.fillText('(m,n) mode energy grid',x1+4,r2y-4);
  ctx.textAlign='right';ctx.font='400 11px sans-serif';ctx.fillStyle=dimCol;ctx.fillText('circle size = amplitude',x1+gridW-4,r2y-4);

  // Right: ghost field
  drawRect(x2,r2y,halfW,gridHt,ghostF,ghostCm,'All phantom modes (isolated)',true,'fabricated by mask');

  // Row 3: dominant ghost | contaminated reconstruction
  drawRect(x1,r3y,halfW,panH,domF,ghostCm,'Strongest phantom: \u03C8('+domM+','+domN+')',true,Math.round(domGhostE/eMax**2*100)+'% of peak');

  // Correct contaminated reconstruction: project masked field onto basis, reconstruct.
  // True-mode coefficient is attenuated by (1 - a_n); ghost modes add on top.
  // Compute attenuation as ratio of masked/true coefficient at (m0,n0).
  const obsF=new Float64Array(NN);
  const attenFactor=Math.abs(trCoeff[m0][n0])>1e-6?mkCoeff[m0][n0]/trCoeff[m0][n0]:1;
  for(let i=0;i<NN;i++)obsF[i]=attenFactor*plate[i]+ghostF[i];
  drawRect(x2,r3y,halfW,panH,obsF,cymCol,'Observer sees: masked reconstruction (true mode attenuated + ghosts)',true,'contaminated');

  requestAnimationFrame(draw);
}
draw();
</script>

</body>
</html>
